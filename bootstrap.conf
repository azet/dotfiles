# debian packages
## 'bare minimum' for day to day work on any debian machine
__pkg_debian="ruby rake rubygems build-essential cmake git wget zsh zsh-dev curl rake \
              zsh-common autoconf automake autotools-dev debhelper dh-make gnupg      \
              fakeroot devscripts lintian patch patchutils quilt python3 golang jq    \
              git-buildpackage screen tmux lmod gnupg-pkcs11-scd w3m gnupg-agent      \
              lftp gcalcli tcpdump tshark pandoc glances radare2 mtr lua5.2 bat ctags \
              luajit lua-curses units cpufrequtils htop linux-tools ethtool glow      \
              sysstat ltrace pwgen gist pcscd scdaemon socat nasm xclip tcpslice ack  \
              hwinfo pstack cpuid git-flow tree highlight peco smbc ncdu fio binwalk"
## optional debugging utilities (lltng chosen over systemtap)
__pkg_debian_debug="blktrace iotop sysdig msr-tools iptraf ltt-bin lttng-tools    \
                    lttng-modules-dkms lttngtop tiptop acpidump latencytop nfstrace"

## list of packages w.r.t GUI/desktop
