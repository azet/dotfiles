                      rxvt-unicode wireshark gns3 libreoffice pidgin pidgin-otr   \
                      pidgin-openpgp kicad steam gimp smplayer transmission       \
                      transmission-remote-gtk transmission-remote-cli rdesktop    \
                      audacious xscreensaver-screensaver-bsod lttv latexmk        \
                      urlview muttprint muttprint-manual mutt-patched mutt        \
                      texlive-full"


