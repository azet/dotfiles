set -g default-shell /bin/zsh

set-window-option -g automatic-rename on

set-option -g set-titles on
set-option -g default-terminal screen-256color
set-option -ag message-style fg=yellow,blink; set-option -ag message-style bg=black

# osx "brew install .."
#set-option -g default-command "reattach-to-user-namespace -l zsh"

setw -g mode-keys vi

setw -g mouse on

set -g history-limit 10000
set -g escape-time 1

setw -g monitor-activity on
set -g visual-activity on

set -g pane-active-border-style fg=green,bg=red,bright

set-window-option -g window-status-fg brightmagenta
set-window-option -g window-status-bg colour236
set-window-option -g window-status-attr dim

set-window-option -g window-status-current-fg brightwhite
set-window-option -g window-status-current-bg colour236
set-window-option -g window-status-current-attr bright

set-option -g status-bg colour235
set-option -g status-fg yellow
set-option -g status-attr dim

set -g status-interval 2
set -g display-time 1000
set -g status-left-length 200
set -g status-left '#[fg=brightyellow,bg=black]#(whoami)#[fg=green,bold]@#[fg=brightblue,bg=black]#h#[default,bold] ·· '
set -g status-justify centre
set -g status-right-length 200
set -g status-right '#[default,bold] :: #[bg=default,bright]#(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}") #[default,bold]·· #[fg=greenbg=default,dim]#(tmux-mem-cpu-load) #[default,bright,bold]·· #[fg=yellow,dim,bg=default]«#(uptime | cut -f 4-5 -d " " | cut -f 1 -d ",")» #[fg=cyan,bg=default][%H:%M:%S @ %a › %d/%m/%y]'

set-option -ga terminal-overrides ',*:enacs@:smacs@:rmacs@:acsc@'

bind B split-window "tmux ls | percol --initial-index $(tmux ls | awk \"/^$(tmux display-message -p '#{session_name}'):/ {print NR-1}\") | cut -d':' -f 1 | tr -d '\n' | xargs -0 tmux switch-client -t"

## nested clipboard
set -g allow-passthrough on

## truecolor passthrough
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

######## TPM / tmux package manager ##########
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
######## TPM / tmux package manager ##########

